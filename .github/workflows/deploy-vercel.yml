name: Deploy to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN1 Actions secret before deploying."
            exit 1
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
        run: npx --yes vercel@60.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
        run: npx --yes vercel@60.1.3 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
        run: npx --yes vercel@60.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
