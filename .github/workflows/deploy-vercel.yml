name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN1 Actions secret before deploying."
            exit 1
          fi

      - name: Link Vercel project
        run: |
          node -e 'require("node:fs").mkdirSync(".vercel", { recursive: true }); require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({ projectId: process.env.VERCEL_PROJECT_ID, orgId: process.env.VERCEL_ORG_ID }))'

      - name: Deploy Vercel services
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
          SEOUL_TOILET_API_KEY: ${{ secrets.SEOUL_TOILET_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -z "$SEOUL_TOILET_API_KEY" ]; then
            echo "::error::Add the SEOUL_TOILET_API_KEY Actions secret before deploying."
            exit 1
          fi
          if [ -z "$VITE_KAKAO_MAP_KEY" ]; then
            echo "::error::Add the VITE_KAKAO_MAP_KEY Actions secret before deploying."
            exit 1
          fi
          if [ -n "$NAVER_CLIENT_ID" ] && [ -n "$NAVER_CLIENT_SECRET" ]; then
            npx --yes vercel@60.1.3 deploy --prod --yes --build-env "VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY" --env "SEOUL_TOILET_API_KEY=$SEOUL_TOILET_API_KEY" --env "NAVER_CLIENT_ID=$NAVER_CLIENT_ID" --env "NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET" --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@60.1.3 deploy --prod --yes --build-env "VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY" --env "SEOUL_TOILET_API_KEY=$SEOUL_TOILET_API_KEY" --token="$VERCEL_TOKEN"
          fi
