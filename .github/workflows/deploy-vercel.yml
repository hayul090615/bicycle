name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN1 Actions secret before deploying."
            exit 1
          fi

      - name: Link Vercel project
        run: |
          node -e 'require("node:fs").mkdirSync(".vercel", { recursive: true }); require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({ projectId: process.env.VERCEL_PROJECT_ID, orgId: process.env.VERCEL_ORG_ID }))'

      - name: Deploy Vercel services
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN1 }}
          SEOUL_TOILET_API_KEY: ${{ secrets.SEOUL_TOILET_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SEOUL_TOILET_API_KEY" ]; then
            echo "::error::Add the SEOUL_TOILET_API_KEY Actions secret before deploying."
            exit 1
          fi
          if [ -z "$VITE_KAKAO_MAP_KEY" ]; then
            echo "::error::Add the VITE_KAKAO_MAP_KEY Actions secret before deploying."
            exit 1
          fi
          deploy_args=(--build-env "VITE_KAKAO_MAP_KEY=$VITE_KAKAO_MAP_KEY" --env "SEOUL_TOILET_API_KEY=$SEOUL_TOILET_API_KEY")
          if [ -n "$NAVER_CLIENT_ID" ] && [ -n "$NAVER_CLIENT_SECRET" ]; then
            deploy_args+=(--env "NAVER_CLIENT_ID=$NAVER_CLIENT_ID" --env "NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET")
          fi
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            deploy_args+=(--build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY")
          fi
          database_url="${SUPABASE_URL:-$VITE_SUPABASE_URL}"
          if [ -n "$database_url" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            deploy_args+=(--env "SUPABASE_URL=$database_url" --env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY")
          fi
          npx --yes vercel@60.1.3 deploy --prod --yes "${deploy_args[@]}" --token="$VERCEL_TOKEN"
